services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: veo
      POSTGRES_PASSWORD: veo
      POSTGRES_DB: veo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veo"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://veo:veo@postgres:5432/veo
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in environment}
      ARTIFACT_DIR: /data/artifacts
      PROVIDER_MODE: ${PROVIDER_MODE:-stub}
    volumes:
      - artifacts:/data/artifacts
    command: sh -c "node dist/migrate.js && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://veo:veo@postgres:5432/veo
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in environment}
      ARTIFACT_DIR: /data/artifacts
      PROVIDER_MODE: ${PROVIDER_MODE:-stub}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    volumes:
      - artifacts:/data/artifacts
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # scale video/image throughput: docker compose up --scale worker=2

  nginx:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app:/usr/share/nginx/html:ro
      - artifacts:/data/artifacts:ro
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  artifacts:
